# Docker Compose for grow-final
# Full-stack container orchestration

name: grow-final

services:
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: grow-final-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - VITE_API_URL=http://server:3001
    restart: unless-stopped
    depends_on:
      - server
    networks:
      - grow-final-network

  server:
    build:
      context: ./apps/server
      dockerfile: Dockerfile
    container_name: grow-final-server
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:password@db:5432/grow-final
    restart: unless-stopped
    depends_on:
      - db
    networks:
      - grow-final-network

  db:
    image: postgres:16-alpine
    container_name: grow-final-postgres
    environment:
      POSTGRES_DB: grow-final
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - grow-final_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - grow-final-network

networks:
  grow-final-network:
    driver: bridge

volumes:
  grow-final_postgres_data:
