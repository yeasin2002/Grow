# Docker Compose for grow
# Full-stack container orchestration

name: grow

services:
  server:
    build:
      context: ./apps/server
      dockerfile: Dockerfile
    container_name: grow-server
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:password@db:5432/grow
    restart: unless-stopped
    depends_on:
      - db
    networks:
      - grow-network

  db:
    image: postgres:16-alpine
    container_name: grow-postgres
    environment:
      POSTGRES_DB: grow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - grow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - grow-network

networks:
  grow-network:
    driver: bridge

volumes:
  grow_postgres_data:
